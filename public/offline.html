<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #faf7f2; color: #2b2117; font-family: system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 360px; text-align: center; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 16px; line-height: 1.5; }
    button { font: inherit; padding: 10px 18px; border: 0; border-radius: 6px; background: #8b4513; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>You are offline</h1>
    <p>Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
