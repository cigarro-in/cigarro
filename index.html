<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- DNS Prefetch for faster external connections -->
    <link rel="dns-prefetch" href="https://cdn.cigarro.in">
    <link rel="preconnect" href="https://cdn.cigarro.in" crossorigin>
    
    <!-- Security Headers - Note: CSP and X-Frame-Options should be set via HTTP headers in production -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(self)">
    
    <!-- SEO Meta Tags -->
    <title>Cigarro | Cigarettes and Tobacco Products Online</title>
    <meta name="description" content="Browse cigarette brands, variants, pack options and related tobacco products online at Cigarro. For adults of legal smoking age only.">
    <meta name="keywords" content="cigarettes online, cigarette brands India, tobacco products India, rolling papers India">
    <meta name="author" content="Cigarro">
    <meta name="robots" content="index, follow">
    <!-- Static canonical so the initial human HTML has one before React
         Helmet mounts (per-page Helmet canonicals override this after verify). -->
    <link rel="canonical" href="https://cigarro.in/">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cigarro.in/">
    <meta property="og:title" content="Cigarro | Cigarettes and Tobacco Products Online">
    <meta property="og:description" content="Browse cigarette brands, variants, pack options and related tobacco products online at Cigarro.">
    <meta property="og:image" content="https://cigarro.in/og-default.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Cigarro online cigarette and tobacco product store">
    <meta property="og:site_name" content="Cigarro">
    <meta property="og:locale" content="en_IN">
    
    <!-- Twitter — must use name=, not property= -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://cigarro.in/">
    <meta name="twitter:title" content="Cigarro | Cigarettes and Tobacco Products Online">
    <meta name="twitter:description" content="Browse cigarette brands, variants, pack options and related tobacco products online at Cigarro.">
    <meta name="twitter:image" content="https://cigarro.in/og-default.jpg">
    <meta name="twitter:image:alt" content="Cigarro online cigarette and tobacco product store">
    
    <!-- Favicon - Dynamic from admin settings (React Helmet will override) -->
    <!-- Google Search requires favicon to be:
         - At least 48x48px (multiples of 48px recommended: 48x48, 96x96, 144x144)
         - In .ico, .png, .jpg, .svg, or .gif format
         - Accessible to Googlebot (not blocked by robots.txt)
         - Served from same domain as website
    -->
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/android-chrome-512x512.png">
    <link rel="manifest" href="/manifest.json">

    <!-- AI shopping agents: start at /agents (in <head> so it ships even behind the age gate) -->
    <link rel="help" href="/agents">
    <link rel="alternate" type="text/plain" title="Store manual for AI agents" href="/llms.txt">
    
    <!-- Additional SEO -->
    <meta name="theme-color" content="#e8e0d2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <!-- Structured Data for Homepage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Cigarro",
      "url": "https://cigarro.in",
      "description": "An online store that helps adult customers in India browse cigarette brands, variants and pack options.",
      "publisher": {
        "@type": "Organization",
        "name": "Cigarro",
        "url": "https://cigarro.in",
        "logo": {
          "@type": "ImageObject",
          "url": "https://cigarro.in/icons/android-chrome-512x512.png"
        }
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://cigarro.in/products?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Cigarro",
      "url": "https://cigarro.in",
      "logo": "https://cigarro.in/icons/android-chrome-512x512.png",
      "description": "Online cigarette and tobacco product catalogue for adult customers in India",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "IN"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "email": "support@cigarro.in"
      }
    }
    </script>
    <!-- NOTE: Cloudflare Web Analytics is intentionally OFF in code. GA4
         (consent-mode, env-only ID) is the single measurement layer to avoid
         double counting + extra payload. To enable CF RUM as well, toggle it
         in the Cloudflare dashboard (auto-injects, no code change needed). -->
    </head>

    <body>
      <div id="root"></div>
      <!-- Crawlable catalog summary for no-JS clients (A9). Factual copy only:
           no health/safety claims. All links are real anchors with hrefs. -->
      <noscript>
        <h1>Cigarro - cigarettes, cigars and tobacco products in India</h1>
        <p>Cigarro.in is an online catalogue of cigarettes, cigars, rolling products and accessories sold in India. Purchase requires age verification (18+, 21+ in Karnataka).</p>
        <nav aria-label="Catalogue">
          <ul>
            <li><a href="/products">All products</a></li>
            <li><a href="/categories">Categories</a></li>
            <li><a href="/brands">Brands</a></li>
            <li><a href="/category/cigarettes">Cigarettes</a></li>
            <li><a href="/category/rolling-stuff">Rolling Stuff</a></li>
            <li><a href="/brand/marlboro">Marlboro</a></li>
            <li><a href="/brand/dunhill">Dunhill</a></li>
            <li><a href="/brand/camel">Camel</a></li>
            <li><a href="/brand/esse">Esse</a></li>
            <li><a href="/brand/davidoff">Davidoff</a></li>
            <li><a href="/blogs">Blog</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/shipping">Shipping</a></li>
            <li><a href="/returns">Returns</a></li>
            <li><a href="/contact">Contact</a></li>
          </ul>
        </nav>
      </noscript>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
